# render.yaml — FreelanceScope Render Deployment Configuration
# Docs: https://render.com/docs/yaml-spec

services:
  # ─────────────────────────────────────────────
  # 1. BACKEND — Node.js / Express API
  # ─────────────────────────────────────────────
  - type: web
    name: freelancescope-api
    runtime: node
    region: singapore   # change to: ohio, oregon, frankfurt, or singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # Set manually in Render dashboard — paste your Atlas URI
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: CLIENT_URL
        sync: false          # Set to your Render frontend URL after it deploys

  # ─────────────────────────────────────────────
  # 2. FRONTEND — React/Vite Static Site
  # ─────────────────────────────────────────────
  - type: web
    name: freelancescope-ui
    runtime: static
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to your backend Render URL, e.g. https://freelancescope-api.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

